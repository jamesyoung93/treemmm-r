on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Phase 1 scaffold: install only hard dependencies (Depends + Imports).
          # Suggests (lightgbm, brms, cmdstanr, treeshap, etc.) require toolchains
          # and Stan installation; they come online in later phases when actually used.
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes", "--ignore-vignettes")'
          error-on: '"error"'
          upload-snapshots: true
